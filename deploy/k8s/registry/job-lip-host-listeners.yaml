apiVersion: batch/v1
kind: Job
metadata:
  name: lip-host-listeners
  namespace: lip-registry
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      hostPID: true
      hostNetwork: true
      containers:
        - name: probe
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -lc
            - |
              apt-get update -qq && apt-get install -y -qq curl iproute2
              echo "=== listeners :80 :443 ==="
              nsenter -t 1 -m -u -i -n -- ss -tlnp | grep -E ':80 |:443 ' || true
              echo "=== curl engine with Host lip ==="
              curl -sS -D - -H "Host: lip.lilangverse.xyz" "http://127.0.0.1/health" -o /tmp/body || true
              cat /tmp/body 2>/dev/null; echo
              echo "=== curl WAN IP ==="
              curl -sS -D - --max-time 5 "http://77.23.124.82/health" -o /tmp/body2 || true
              head -c 200 /tmp/body2 2>/dev/null; echo
              echo "=== hostname / ip ==="
              nsenter -t 1 -m -u -i -n -- hostname
              nsenter -t 1 -m -u -i -n -- ip -4 addr show | grep inet
