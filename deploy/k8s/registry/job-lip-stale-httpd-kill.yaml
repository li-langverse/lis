apiVersion: batch/v1
kind: Job
metadata:
  name: lip-stale-httpd-kill
  namespace: lip-registry
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      hostPID: true
      containers:
        - name: kill
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -c
            - |
              apt-get update -qq && apt-get install -y -qq util-linux
              nsenter -t 1 -m -u -i -n -- bash -c 'pkill -f li-httpd || true; sleep 1; ss -tlnp | grep ":80 " || echo port80-free'
