apiVersion: v1
kind: ConfigMap
metadata:
  name: lip-registry-config
  namespace: lip-registry
  labels:
    app: lip-registry
    app.kubernetes.io/part-of: lip-platform
data:
  LI_PROFILE: registry-min
  LI_DATA_DIR: /data
  LIDB_ROOT: /opt/lidb
  LIDB_EMBED: /opt/lidb/build/smoke/lidb_embed
  LIDB_DATA_DIR: /data
  LI_REGISTRY_API: "1"
  LI_REGISTRY_MOCK: "0"
  LI_REGISTRY_HOST: "0.0.0.0"
  LIP_BLOB_DIR: /data/blobs
  LIP_REGISTRY_REQUIRE_BLOB: "1"
  LIP_REGISTRY_ALLOW_DEV_TOKEN: "1"
  LIP_REGISTRY_PUBLIC_URL: "https://lip.lilangverse.xyz/v1"
  LIS_ROOT: /opt/lis
