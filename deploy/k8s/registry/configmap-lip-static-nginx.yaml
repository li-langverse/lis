apiVersion: v1
kind: ConfigMap
metadata:
  name: lip-static-nginx
  namespace: lip-registry
  labels:
    app: lip-static
    app.kubernetes.io/part-of: lip-platform
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location = /account {
        try_files /account.html =404;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
