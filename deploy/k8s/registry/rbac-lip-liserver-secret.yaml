apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lip-liserver-secret-admin
  namespace: lip-registry
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lip-liserver-secret-admin
  namespace: lip-registry
subjects:
  - kind: ServiceAccount
    name: default
    namespace: lip-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lip-liserver-secret-admin
