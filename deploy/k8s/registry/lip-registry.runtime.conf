listen_port=443
listen_port_http=80
document_root=/var/lib/li-httpd/empty
rate_limit_rps=1000
rate_limit_burst=2000
route=GET|/health|exact|proxy
route=HEAD|/health|exact|proxy
route=GET|/v1|prefix|proxy
route=HEAD|/v1|prefix|proxy
route=POST|/v1|prefix|proxy
route=PUT|/v1|prefix|proxy
route=PATCH|/v1|prefix|proxy
route=DELETE|/v1|prefix|proxy
route=OPTIONS|/v1|prefix|proxy
route=GET|/account|prefix|proxy
route=POST|/account|prefix|proxy
upstream_peer=30422
leak_censor_enabled=0
tls_enabled=1
tls_mode=self_signed
tls_min_protocol=1.3
tls_cert_dir=/var/lib/li-httpd/tls/lip
tls_self_signed_dev=1
m2_enabled=0
m3_enabled=0
