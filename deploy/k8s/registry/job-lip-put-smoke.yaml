apiVersion: batch/v1
kind: Job
metadata:
  name: lip-put-smoke
  namespace: lip-registry
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: smoke
          image: curlimages/curl:8.14.1
          command:
            - /bin/sh
            - -lc
            - |
              set -eu
              payload="li-put-smoke-payload-$$"
              digest="sha256:$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
              echo "PUT via liserver :80 digest=$digest"
              curl -fsS -m 30 -X PUT \
                -H "Host: lip.lilangverse.xyz" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/vnd.li.package+tar" \
                --data-binary "$payload" \
                "http://127.0.0.1:80/v1/blobs/${digest}"
              echo
              echo "PUT via nodeport :30422"
              curl -fsS -m 30 -X PUT \
                -H "Host: lip.lilangverse.xyz" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/vnd.li.package+tar" \
                --data-binary "$payload" \
                "http://127.0.0.1:30422/v1/blobs/${digest}"
              echo
              echo "lip-put-smoke: PASS"
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: LI_REGISTRY_DEV_TOKEN
