# liserver bundle: pre-flattened runtime + host install entrypoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lip-liserver-bundle
  namespace: lip-registry
  labels:
    app: lip-liserver
    app.kubernetes.io/part-of: lip-platform
data:
  lip-registry.runtime.conf: |
    listen_port=80
    document_root=/var/lib/li-httpd/empty
    rate_limit_rps=1000
    rate_limit_burst=2000
    route=GET|/health|exact|proxy
    route=HEAD|/health|exact|proxy
    route=GET|/v1|prefix|proxy
    route=HEAD|/v1|prefix|proxy
    route=POST|/v1|prefix|proxy
    route=PUT|/v1|prefix|proxy
    route=PATCH|/v1|prefix|proxy
    route=DELETE|/v1|prefix|proxy
    route=OPTIONS|/v1|prefix|proxy
    route=GET|/account|prefix|proxy
    route=POST|/account|prefix|proxy
    upstream_peer=30422
    leak_censor_enabled=0
    tls_enabled=0
    m2_enabled=0
    m3_enabled=0
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    apt-get update -qq && apt-get install -y -qq socat
    pkill -f '/usr/local/bin/li-httpd' 2>/dev/null || true
    pkill -x socat 2>/dev/null || true
    sleep 1
    mkdir -p /var/lib/li-httpd/empty /run/li-httpd
    install -m 755 /bin/li-httpd /usr/local/bin/li-httpd
    install -m 644 /config/lip-registry.runtime.conf /run/li-httpd/lip-registry.runtime.conf
    /usr/local/bin/li-httpd /run/li-httpd/lip-registry.runtime.conf &
    sleep 1
    # li-httpd binds 127.0.0.1 today; expose on all interfaces for engine :80 edge.
    exec socat TCP-LISTEN:80,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lip-liserver
  namespace: lip-registry
  labels:
    app: lip-liserver
    app.kubernetes.io/name: lip-liserver
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: lip-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lip-liserver
  template:
    metadata:
      labels:
        app: lip-liserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: stop-nginx
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -lc
            - |
              apt-get update -qq && apt-get install -y -qq util-linux
              nsenter -t 1 -m -u -i -n -- systemctl stop nginx 2>/dev/null || true
              nsenter -t 1 -m -u -i -n -- systemctl disable nginx 2>/dev/null || true
              nsenter -t 1 -m -u -i -n -- systemctl mask nginx 2>/dev/null || true
              echo "nginx stopped/disabled/masked on host"
      containers:
        - name: liserver
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command: ["/bin/bash", "/config/entrypoint.sh"]
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              httpHeaders:
                - name: Host
                  value: lip.lilangverse.xyz
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              httpHeaders:
                - name: Host
                  value: lip.lilangverse.xyz
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: li-httpd-bin
              mountPath: /bin/li-httpd
              subPath: li-httpd
            - name: config
              mountPath: /config
            - name: tls
              mountPath: /var/lib/li-httpd/tls/lip
            - name: run
              mountPath: /run/li-httpd
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
      volumes:
        - name: li-httpd-bin
          secret:
            secretName: lip-liserver-bin
            defaultMode: 0755
        - name: config
          configMap:
            name: lip-liserver-bundle
            defaultMode: 0755
        - name: tls
          emptyDir: {}
        - name: run
          emptyDir: {}
