apiVersion: batch/v1
kind: Job
metadata:
  name: lip-multipeer-e2e
  namespace: lip-registry
spec:
  ttlSecondsAfterFinished: 900
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: e2e
          image: python:3.12-slim
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq curl ca-certificates git
              LIS_REF="${LIS_GIT_REF:-feat/lip-registry-p5-edge}"
              git clone --depth 1 --branch "$LIS_REF" https://github.com/li-langverse/lis.git /src/lis
              export LIP_REGISTRY_TOKEN="${LIP_REGISTRY_TOKEN}"
              export REGISTRY_HOST=127.0.0.1
              export REGISTRY_PORT=80
              export LIP_REGISTRY_HOST=lip.lilangverse.xyz
              export LIP_PEER_A_URL=http://lip-peer-a.lip-registry.svc.cluster.local:8765/v1
              export LIP_PEER_B_URL=http://lip-peer-b.lip-registry.svc.cluster.local:8766/v1
              curl -fsS -H "Host: lip.lilangverse.xyz" http://127.0.0.1:80/health
              echo
              bash /src/lis/scripts/lip-multipeer-e2e.sh
          env:
            - name: LIP_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: LI_REGISTRY_DEV_TOKEN
