# Bootstrap registry API when ghcr.io/li-langverse/lis:registry-min is unavailable.
# Uses git clone + python registry server (mock store until full image is pushed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lip-registry-bootstrap
  namespace: lip-registry
  labels:
    app: lip-registry
    app.kubernetes.io/name: lip-registry
    app.kubernetes.io/component: registry-api
    app.kubernetes.io/part-of: lip-platform
    li-langverse.io/cluster: engine
    li-langverse.io/bootstrap: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lip-registry
  template:
    metadata:
      labels:
        app: lip-registry
        app.kubernetes.io/name: lip-registry
        app.kubernetes.io/component: registry-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      containers:
        - name: registry
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git ca-certificates
              LIS_DIR=/opt/lis
              if [[ ! -d "$LIS_DIR/.git" ]]; then
                rm -rf "$LIS_DIR"
                LIS_REPO_URL="${LIS_REPO_URL:-https://gitlab.lilangverse.xyz/li-langverse/lis.git}"
                if [[ "$LIS_REPO_URL" == *gitlab.lilangverse.xyz* && -n "${GITLAB_TOKEN:-}" ]]; then
                  git config --global url."https://oauth2:${GITLAB_TOKEN}@gitlab.lilangverse.xyz/".insteadOf "https://gitlab.lilangverse.xyz/" 2>/dev/null || true
                elif [[ "$LIS_REPO_URL" == *github.com* && -n "${GH_TOKEN:-}" ]]; then
                  git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/" 2>/dev/null || true
                fi
                git clone --depth 1 "$LIS_REPO_URL" "$LIS_DIR"
              fi
              if [[ -d /opt/lis-patch ]]; then
                cp -f /opt/lis-patch/registry-handlers.py "$LIS_DIR/routes/registry/handlers.py"
                cp -f /opt/lis-patch/registry-server.py "$LIS_DIR/routes/registry/server.py"
                cp -f /opt/lis-patch/registry-liorm_mock.py "$LIS_DIR/routes/registry/liorm_mock.py"
                cp -f /opt/lis-patch/registry-blob_store.py "$LIS_DIR/routes/registry/blob_store.py"
                cp -f /opt/lis-patch/registry-peer_store.py "$LIS_DIR/routes/registry/peer_store.py"
                mkdir -p "$LIS_DIR/routes/auth"
                cp -f /opt/lis-patch/auth-handlers.py "$LIS_DIR/routes/auth/handlers.py"
                cp -f /opt/lis-patch/auth-verify.py "$LIS_DIR/routes/auth/verify.py"
                cp -f /opt/lis-patch/auth-store.py "$LIS_DIR/routes/auth/store.py"
                cp -f /opt/lis-patch/auth-mock_store.py "$LIS_DIR/routes/auth/mock_store.py"
                cp -f /opt/lis-patch/auth-crypto_util.py "$LIS_DIR/routes/auth/crypto_util.py"
                cp -f /opt/lis-patch/auth-jwt_util.py "$LIS_DIR/routes/auth/jwt_util.py"
                cp -f /opt/lis-patch/auth-errors.py "$LIS_DIR/routes/auth/errors.py"
                cp -f /opt/lis-patch/auth-__init__.py "$LIS_DIR/routes/auth/__init__.py"
              fi
              cd "$LIS_DIR"
              export PYTHONPATH="$LIS_DIR${PYTHONPATH:+:$PYTHONPATH}"
              export LI_REGISTRY_MOCK="${LI_REGISTRY_MOCK:-1}"
              export LI_REGISTRY_HOST=0.0.0.0
              exec python3 routes/registry/server.py --host 0.0.0.0 --port 54321
          ports:
            - name: http
              containerPort: 54321
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lip-registry-config
          env:
            - name: LI_REGISTRY_MOCK
              value: "1"
            - name: LI_REGISTRY_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: LI_REGISTRY_DEV_TOKEN
            - name: LI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: LI_JWT_SECRET
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lip-registry-secrets
                  key: GH_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: blob-store
              mountPath: /data/blobs
            - name: routes-patch
              mountPath: /opt/lis-patch
      volumes:
        - name: routes-patch
          configMap:
            name: lip-registry-routes-patch
        - name: data
          persistentVolumeClaim:
            claimName: lip-registry-data
        - name: blob-store
          hostPath:
            path: /var/lib/lip-registry/blobs
            type: DirectoryOrCreate
