apiVersion: batch/v1
kind: Job
metadata:
  name: engine-image-inventory
  namespace: lip-registry
  labels:
    li-langverse.io/one-shot: inventory
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      restartPolicy: Never
      containers:
        - name: inv
          image: alpine:3.21
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "=== disk ==="
              chroot /host df -h / /var/lib/rancher/k3s 2>/dev/null || chroot /host df -h /
              CTR=""
              for c in /usr/local/bin/ctr /host/usr/local/bin/ctr /host/var/lib/rancher/k3s/data/current/bin/ctr; do
                if chroot /host test -x "${c#/host}" 2>/dev/null || [ -x "$c" ]; then
                  CTR="$c"; break
                fi
              done
              [ -z "$CTR" ] && CTR=/host/usr/local/bin/ctr
              echo "=== ctr: $CTR ==="
              chroot /host /usr/local/bin/ctr -n k8s.io images ls 2>&1 | grep -E 'li-langverse|REPOSITORY' || true
              echo "=== total refs ==="
              chroot /host /usr/local/bin/ctr -n k8s.io images ls -q 2>/dev/null | wc -l || echo 0
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
