apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-backup-full-daily
  namespace: gitlab
  labels:
    app: gitlab-backup
    app.kubernetes.io/name: gitlab-backup-full
    app.kubernetes.io/part-of: gitlab-ha
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: gitlab-backup
            backup-type: full-daily
        spec:
          serviceAccountName: gitlab-backup
          restartPolicy: OnFailure
          nodeSelector:
            li-langverse.io/node-pool: engine
          containers:
            - name: backup
              image: alpine/k8s:1.32.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export BACKUP_ROOT=/backups
                  export SCRIPT_DIR=/scripts
                  sh /scripts/backup-full.sh
              env:
                - name: GITLAB_NAMESPACE
                  value: gitlab
                - name: GITLAB_POD
                  value: gitlab-0
                - name: GITLAB_BACKUP_SKIP
                  value: registry,artifacts,builds,pages,lfs,terraform_state,packages,ci_secure_files
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: gitlab-backup-storage
            - name: scripts
              configMap:
                name: gitlab-backup-scripts
                defaultMode: 0555
