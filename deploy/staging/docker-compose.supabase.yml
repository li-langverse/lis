# Optional self-hosted Supabase data plane (Kong on :8000 inside the staging network).
# Based on https://github.com/supabase/supabase/tree/master/docker — trimmed for staging.
# Use: docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d

services:
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports: [] # internal only; edge is Caddy → kong:8000
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - staging

  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - staging

volumes:
  db_data:
