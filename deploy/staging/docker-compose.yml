# Majico staging stack (containers + Caddy edge rendered from li-httpd TOML).
# Data plane: pin to Supabase self-hosted compose (see docker-compose.supabase.yml).
# Edge: Caddy until li-httpd M1 replaces the renderer.

name: majico-staging

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - staging
    depends_on:
      - majico-web

  majico-web:
    image: ${MAJICO_WEB_IMAGE:-node:22-bookworm}
    command: ["sh", "-c", "echo majico-web placeholder — set MAJICO_WEB_IMAGE to your Next.js image; sleep infinity"]
    env_file:
      - path: .env
        required: false
    networks:
      - staging

  pulse-web:
    image: ${PULSE_WEB_IMAGE:-node:22-bookworm}
    command: ["sh", "-c", "echo pulse-web placeholder — set PULSE_WEB_IMAGE; sleep infinity"]
    env_file:
      - path: .env
        required: false
    networks:
      - staging

volumes:
  caddy_data:
  caddy_config:

networks:
  staging:
    name: majico-staging
