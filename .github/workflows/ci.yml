name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-security-load:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-14
          - os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Checkout lidb (PH-DB-3 embed)
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lidb
          path: lidb
          ref: main

      - name: Infra + security + load (stub harness)
        env:
          LIDB_REPO: ${{ github.workspace }}/lidb
        run: ./scripts/ci.sh

  merge-gate:
    name: merge-gate
    needs: infra-security-load
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - run: echo "All OS jobs passed — safe to merge main <-> dev"
