name: PH-DB compose smoke

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "docker-compose.ph-db.yml"
      - "docker/**"
      - ".github/workflows/ph-db-compose-smoke.yml"
  push:
    branches: [main, dev]
    paths:
      - "docker-compose.ph-db.yml"
      - "docker/**"
      - ".github/workflows/ph-db-compose-smoke.yml"
  workflow_dispatch:

concurrency:
  group: ph-db-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: docker-compose.ph-db.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: lis
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lidb
          ref: main
          path: lidb
      - name: Compose up
        working-directory: lis
        run: |
          docker compose -f docker-compose.ph-db.yml up --build --wait --abort-on-container-exit
          docker compose -f docker-compose.ph-db.yml exec -T lis-db bash -lc             '/opt/lis/bin/lis db status | grep -q "lidb_link:.*native"'
      - name: Compose down
        if: always()
        working-directory: lis
        run: docker compose -f docker-compose.ph-db.yml down -v
